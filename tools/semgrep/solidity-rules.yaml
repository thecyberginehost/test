rules:
  - id: reentrancy-eth-transfer-before-state
    patterns:
      - pattern: |
          $ADDR.call{value: $AMT}($DATA);
          ...
          $STATE[$KEY] = $VAL;
    message: "External call before state update - potential reentrancy"
    languages: [solidity]
    severity: ERROR
    metadata:
      category: reentrancy
      impact: critical

  - id: tx-origin-auth
    pattern: require(tx.origin == $ADDR)
    message: "tx.origin used for authentication - vulnerable to phishing"
    languages: [solidity]
    severity: ERROR
    metadata:
      category: access-control
      impact: high

  - id: unchecked-transfer
    patterns:
      - pattern: $TOKEN.transfer($TO, $AMT)
      - pattern-not-inside: require($TOKEN.transfer($TO, $AMT))
      - pattern-not-inside: |
          bool $RET = $TOKEN.transfer($TO, $AMT);
          ...
          require($RET)
    message: "ERC20 transfer without return value check. Use SafeERC20."
    languages: [solidity]
    severity: WARNING
    metadata:
      category: token
      impact: medium

  - id: dangerous-delegatecall
    patterns:
      - pattern: $ADDR.delegatecall($DATA)
      - metavariable-pattern:
          metavariable: $ADDR
          patterns:
            - pattern-not: address(this)
    message: "delegatecall to external address - verify not user-controlled"
    languages: [solidity]
    severity: ERROR
    metadata:
      category: access-control
      impact: critical

  - id: missing-zero-address-check
    patterns:
      - pattern: |
          function $FUNC(..., address $ADDR, ...) ... {
            ...
          }
      - pattern-not-inside: |
          require($ADDR != address(0), ...)
      - pattern-not-inside: |
          if ($ADDR == address(0)) revert ...
    message: "No zero-address check on address parameter"
    languages: [solidity]
    severity: WARNING
    metadata:
      category: validation
      impact: low

  - id: block-timestamp-deadline
    patterns:
      - pattern: require(block.timestamp <= $DEADLINE)
    message: "Block timestamp used for deadline - miners can manipulate ~15s"
    languages: [solidity]
    severity: INFO
    metadata:
      category: timing
      impact: low

  - id: unchecked-math
    patterns:
      - pattern: |
          unchecked {
            ...
            $A + $B
            ...
          }
    message: "Arithmetic in unchecked block - verify overflow impossible"
    languages: [solidity]
    severity: WARNING
    metadata:
      category: arithmetic
      impact: high

  - id: selfdestruct-present
    pattern: selfdestruct($ADDR)
    message: "selfdestruct present - verify access control"
    languages: [solidity]
    severity: ERROR
    metadata:
      category: access-control
      impact: critical

  - id: chainlink-no-staleness-check
    patterns:
      - pattern: |
          (, int $PRICE,,,) = $FEED.latestRoundData()
      - pattern-not-inside: |
          require($UPDATED > ...)
    message: "Chainlink latestRoundData without staleness check"
    languages: [solidity]
    severity: ERROR
    metadata:
      category: oracle
      impact: high

  - id: spot-price-from-reserves
    pattern: $PAIR.getReserves()
    message: "Reading DEX reserves - if used for pricing, vulnerable to flash loan manipulation"
    languages: [solidity]
    severity: WARNING
    metadata:
      category: oracle
      impact: critical
